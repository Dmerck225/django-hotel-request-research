<!DOCTYPE html>
<html>
<head>
    <title>Request Queue</title>
</head>
<body>
    <h1>Hotel Request Queue</h1>

    <table border="1" cellpadding="8">
        <tr>
            <th>Room</th>
            <th>Request</th>
            <th>Details</th>
            <th>Status</th>
        </tr>

        {% for request in requests %}
        <tr>
            <td>{{ request.room_number }}</td>
            <td>{{ request.request_type }}</td>
            <td>{{ request.details }}</td>
            <td>{{ request.status }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No requests have been submitted yet.</td>
        </tr>
        {% endfor %}
    </table>

    <p><a href="/">Make a request</a></p>
</body>
</html>
